# Builds both microcontroller firmwares on every firmware change. The robot downloads the artifacts
# (robotd/firmware.py fetch_ci_firmware) because its 32-bit Orange Pi cannot run the ESP32 toolchain.
name: firmware
on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cores and libraries (pinned to the versions verified on the robot)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12 rp2040:rp2040@4.5.3
          arduino-cli lib install LovyanGFX@1.2.7 ArduinoJson@7.4.1
      - name: CYD dashboard (ESP32-2432S028R)
        run: arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=huge_app --output-dir out/cyd firmware/cyd_dashboard
      - name: RP2040 motor controller (Waveshare RP2040 Zero)
        run: arduino-cli compile -b rp2040:rp2040:waveshare_rp2040_zero --output-dir out/rp2040 firmware/rp2040_motor_usb
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            out/cyd/cyd_dashboard.ino.bin
            out/cyd/cyd_dashboard.ino.merged.bin
            out/rp2040/rp2040_motor_usb.ino.uf2
