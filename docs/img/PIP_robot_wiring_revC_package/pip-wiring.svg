<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The whole Pip circuit: power, brain, screen, motor board and sensors</title>
  <defs>
    <style>
      .ink { fill: #1b2233; }
      .muted { fill: #5b6375; }
      .box { fill: #ffffff; stroke: #1b2233; stroke-width: 2; }
      .brain { fill: #eef2ff; stroke: #1b2233; stroke-width: 2; }
      .sense { fill: #f3fbf5; stroke: #1b2233; stroke-width: 2; }
      .plug { fill: #d5d9df; stroke: #5b6375; stroke-width: 1.5; }
      .v11 { stroke: #d8342c; stroke-width: 4; fill: none; }
      .v75 { stroke: #e58a00; stroke-width: 4; fill: none; }
      .v5 { stroke: #1f9d55; stroke-width: 4; fill: none; }
      .gnd { stroke: #1b2233; stroke-width: 4; fill: none; }
      .bal { stroke: #8a93a0; stroke-width: 2; fill: none; }
      .data { stroke: #7b4fc9; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
      .h { font-weight: 700; font-size: 15px; }
      .s { font-size: 13px; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="24" y="36" class="ink" font-size="24" font-weight="700">The whole Pip circuit (the first Pip)</text>
  <text x="24" y="58" class="muted" font-size="14.5">Power on the left, the brain on the right, the motor board at the bottom. Yours can be different: every part is optional.</text>

  <g transform="translate(0,80)">
    <!-- INA219 I2C to brain 26-pin header -->
    <path d="M485 60 V12 H1130 V100 H1050" class="data"/>
    <text x="560" y="5" class="ink s">I2C bus 0: SDA pin 3, SCL pin 5 on the 26-pin header (INA219 at 0x40)</text>

    <!-- Pack -->
    <rect x="24" y="60" width="140" height="100" rx="8" class="box"/>
    <text x="94" y="88" text-anchor="middle" class="ink h">Battery pack</text>
    <text x="94" y="108" text-anchor="middle" class="ink s">3S3P, 11.1 V</text>
    <text x="94" y="126" text-anchor="middle" class="ink s">taps: 0, 3.7,</text>
    <text x="94" y="142" text-anchor="middle" class="ink s">7.4, 11.1 V</text>
    <line x1="164" y1="90" x2="180" y2="90" class="v11" stroke-width="3"/>
    <line x1="164" y1="102" x2="180" y2="102" class="bal"/>
    <line x1="164" y1="114" x2="180" y2="114" class="bal"/>
    <line x1="164" y1="126" x2="180" y2="126" class="gnd" stroke-width="3"/>
    <rect x="180" y="80" width="28" height="56" rx="3" class="plug"/>
    <line x1="208" y1="90" x2="224" y2="90" class="v11" stroke-width="3"/>
    <line x1="208" y1="102" x2="224" y2="102" class="bal"/>
    <line x1="208" y1="114" x2="224" y2="114" class="bal"/>
    <line x1="208" y1="126" x2="224" y2="126" class="gnd" stroke-width="3"/>

    <!-- BMS -->
    <rect x="224" y="60" width="160" height="100" rx="8" class="box"/>
    <text x="304" y="86" text-anchor="middle" class="ink h">Battery cutoff</text>
    <text x="304" y="106" text-anchor="middle" class="ink s">3S BMS, 20 A</text>
    <text x="304" y="124" text-anchor="middle" class="ink s">pads 0V, 4V, 8V, 12.6V</text>
    <text x="304" y="142" text-anchor="middle" class="ink s">output 11.1 V + / −</text>

    <!-- BMS + through INA219 -->
    <line x1="384" y1="90" x2="420" y2="90" class="v11"/>
    <rect x="420" y="60" width="130" height="60" rx="8" class="sense"/>
    <text x="485" y="84" text-anchor="middle" class="ink h">INA219</text>
    <text x="485" y="104" text-anchor="middle" class="ink s">in the + wire</text>
    <line x1="550" y1="90" x2="580" y2="90" class="v11"/>
    <line x1="384" y1="140" x2="580" y2="140" class="gnd"/>
    <rect x="580" y="72" width="32" height="84" rx="3" class="plug"/>
    <text x="596" y="174" text-anchor="middle" class="ink s">T-plug</text>

    <!-- bus -->
    <path d="M612 90 H640 M640 55 V245 M640 55 H680 M640 245 H680" class="v11"/>
    <path d="M612 140 H634 a6 6 0 0 1 12 0 H655 M655 75 V265 M655 75 H680 M655 265 H680" class="gnd"/>

    <!-- regulators -->
    <rect x="680" y="36" width="140" height="58" rx="8" class="box"/>
    <text x="750" y="60" text-anchor="middle" class="ink h">Regulator 5 V</text>
    <text x="750" y="80" text-anchor="middle" class="ink s">AJ26 V3.2</text>
    <rect x="680" y="226" width="140" height="58" rx="8" class="box"/>
    <text x="750" y="250" text-anchor="middle" class="ink h">Regulator 7.5 V</text>
    <text x="750" y="270" text-anchor="middle" class="ink s">AJ26 V3.2</text>

    <!-- 5 V to brain 13-pin header -->
    <line x1="820" y1="55" x2="880" y2="55" class="v5"/>
    <line x1="820" y1="75" x2="880" y2="75" class="gnd"/>
    <text x="826" y="47" class="ink s">pin 1</text>
    <text x="826" y="93" class="ink s">pin 2</text>

    <!-- Brain -->
    <rect x="880" y="36" width="170" height="174" rx="8" class="brain"/>
    <text x="965" y="62" text-anchor="middle" class="ink h">Orange Pi Zero</text>
    <text x="965" y="82" text-anchor="middle" class="ink s">the brain</text>
    <text x="890" y="112" class="muted s">13-pin header</text>
    <text x="890" y="128" class="muted s">(left side):</text>
    <text x="890" y="144" class="muted s">1 = 5 V, 2 = GND</text>
    <text x="890" y="160" class="muted s">3/4 = USB2</text>
    <text x="890" y="176" class="muted s">5/6 = USB3</text>
    <text x="1040" y="128" text-anchor="end" class="muted s">26-pin</text>
    <text x="1040" y="144" text-anchor="end" class="muted s">(right)</text>

    <!-- PIR -->
    <path d="M1050 170 H1090" class="data"/>
    <rect x="1090" y="140" width="100" height="70" rx="8" class="sense"/>
    <text x="1140" y="164" text-anchor="middle" class="ink h">PIR</text>
    <text x="1140" y="182" text-anchor="middle" class="ink s">motion sensor</text>
    <text x="1140" y="226" text-anchor="middle" class="ink s">signal: pin 7</text>
    <text x="1140" y="242" text-anchor="middle" class="ink s">5 V and GND</text>

    <!-- USB hub -->
    <path d="M1000 210 V250" class="data"/>
    <rect x="900" y="250" width="200" height="58" rx="8" class="box"/>
    <text x="1000" y="274" text-anchor="middle" class="ink h">USB hub</text>
    <text x="1000" y="293" text-anchor="middle" class="ink s">webcam (eyes, ears), Bluetooth</text>

    <!-- USB3 to CYD -->
    <path d="M880 150 H868 V440 H900" class="data"/>
    <text x="878" y="388" class="ink s">USB3 (pins 5/6) + 5 V</text>
    <rect x="900" y="404" width="180" height="72" rx="8" class="box"/>
    <text x="990" y="430" text-anchor="middle" class="ink h">CYD touchscreen</text>
    <text x="990" y="450" text-anchor="middle" class="ink s">the face and the voice</text>
    <text x="990" y="466" text-anchor="middle" class="muted s">USB-C</text>

    <!-- PCF8574 on CYD I2C -->
    <path d="M990 476 V530" class="data"/>
    <text x="980" y="508" text-anchor="end" class="ink s">CYD I2C (CN1): SDA IO27, SCL IO22, 3.3 V</text>
    <rect x="900" y="530" width="180" height="58" rx="8" class="sense"/>
    <text x="990" y="554" text-anchor="middle" class="ink h">PCF8574</text>
    <text x="990" y="573" text-anchor="middle" class="ink s">spare I/O (unused now)</text>

    <!-- USB2 to RP2040 -->
    <path d="M880 190 H848 V360 H360 V390" class="data"/>
    <text x="440" y="352" class="ink s">USB2 (pins 3/4) + 5 V, USB-C</text>

    <!-- 7.5 V to motor board -->
    <line x1="730" y1="284" x2="730" y2="320" class="v75"/>
    <line x1="770" y1="284" x2="770" y2="320" class="gnd"/>
    <rect x="715" y="320" width="70" height="24" rx="3" class="plug"/>
    <text x="795" y="337" class="ink s">T-plug</text>
    <path d="M730 344 V420 H660" class="v75"/>
    <path d="M770 344 V444 H660" class="gnd"/>

    <!-- RP2040 + L293D -->
    <rect x="300" y="390" width="120" height="80" rx="8" class="box"/>
    <text x="360" y="420" text-anchor="middle" class="ink h">RP2040 Zero</text>
    <text x="360" y="440" text-anchor="middle" class="ink s">motor control,</text>
    <text x="360" y="456" text-anchor="middle" class="ink s">stops in 0.5 s</text>
    <line x1="420" y1="430" x2="440" y2="430" class="bal" stroke-width="3"/>
    <rect x="440" y="390" width="220" height="80" rx="8" class="box"/>
    <text x="550" y="418" text-anchor="middle" class="ink h">L293D board</text>
    <text x="550" y="438" text-anchor="middle" class="ink s">8 motor channels</text>
    <text x="550" y="456" text-anchor="middle" class="muted s">EXT VOLTAGE in (7.5 V)</text>

    <!-- Motors -->
    <line x1="490" y1="470" x2="490" y2="510" class="v75"/>
    <line x1="610" y1="470" x2="610" y2="510" class="v75"/>
    <rect x="440" y="510" width="100" height="44" rx="8" class="box"/>
    <text x="490" y="530" text-anchor="middle" class="ink h">Motor 7</text>
    <text x="490" y="546" text-anchor="middle" class="ink s">left wheel</text>
    <rect x="560" y="510" width="100" height="44" rx="8" class="box"/>
    <text x="610" y="530" text-anchor="middle" class="ink h">Motor 8</text>
    <text x="610" y="546" text-anchor="middle" class="ink s">right wheel</text>

    <!-- IMU -->
    <path d="M360 470 V510" class="data"/>
    <text x="352" y="496" text-anchor="end" class="ink s">I2C1: SDA GPIO26, SCL GPIO27</text>
    <rect x="290" y="510" width="140" height="58" rx="8" class="sense"/>
    <text x="360" y="534" text-anchor="middle" class="ink h">MPU-6050</text>
    <text x="360" y="553" text-anchor="middle" class="ink s">GY-521, for wheelies</text>

    <!-- Notes -->
    <g class="ink" font-size="14">
      <text x="24" y="226" font-weight="700" font-size="15">Good to know</text>
      <text x="24" y="250">• The regulated 5 V goes into the 13-pin header</text>
      <text x="38" y="268">(pin 1) and the USB hub's power, jumpered</text>
      <text x="38" y="286">together. The CYD and RP2040 take 5 V from there.</text>
      <text x="24" y="310">• Motors get only the 7.5 V side, never the 5 V.</text>
      <text x="24" y="334">• All grounds are joined.</text>
    </g>

    <!-- Legend -->
    <g transform="translate(24,620)" class="ink" font-size="13.5">
      <line x1="0" y1="10" x2="34" y2="10" class="v11"/><text x="42" y="15">11.1 V battery</text>
      <line x1="160" y1="10" x2="194" y2="10" class="v75"/><text x="202" y="15">7.5 V motors</text>
      <line x1="310" y1="10" x2="344" y2="10" class="v5"/><text x="352" y="15">5 V electronics</text>
      <line x1="475" y1="10" x2="509" y2="10" class="gnd"/><text x="517" y="15">ground</text>
      <line x1="590" y1="10" x2="624" y2="10" class="bal"/><text x="632" y="15">balance / board link</text>
      <line x1="790" y1="10" x2="824" y2="10" class="data"/><text x="832" y="15">data (I2C, USB)</text>
      <rect x="965" y="0" width="22" height="20" rx="3" class="plug"/><text x="995" y="15">plug</text>
      <rect x="1050" y="0" width="22" height="20" rx="4" class="sense"/><text x="1080" y="15">sensor</text>
    </g>
  </g>
</svg>
