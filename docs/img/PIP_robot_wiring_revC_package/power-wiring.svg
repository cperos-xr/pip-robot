<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 640" width="1130" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pip power wiring: battery, protection board, INA219, two regulators, brain and motor board</title>
  <defs>
    <style>
      .ink { fill: #1b2233; }
      .muted { fill: #5b6375; }
      .box { fill: #ffffff; stroke: #1b2233; stroke-width: 2; }
      .brain { fill: #eef2ff; stroke: #1b2233; stroke-width: 2; }
      .plug { fill: #d5d9df; stroke: #5b6375; stroke-width: 1.5; }
      .v11 { stroke: #d8342c; stroke-width: 4; fill: none; }
      .v75 { stroke: #e58a00; stroke-width: 4; fill: none; }
      .v5 { stroke: #1f9d55; stroke-width: 4; fill: none; }
      .gnd { stroke: #1b2233; stroke-width: 4; fill: none; }
      .bal { stroke: #8a93a0; stroke-width: 2; fill: none; }
      .data { stroke: #7b4fc9; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
      .h { font-weight: 700; font-size: 15px; }
      .s { font-size: 13px; }
    </style>
  </defs>
  <rect width="1130" height="640" fill="#ffffff"/>

  <text x="24" y="36" class="ink" font-size="24" font-weight="700">Pip power wiring (the first Pip)</text>
  <text x="24" y="60" class="muted" font-size="14.5">It works, but the layout is not final. Grey boxes are plugs: the places it comes apart.</text>

  <g transform="translate(0,50)">
    <!-- I2C data route: INA219 to brain -->
    <path d="M520 110 V40 H1030 V70" class="data"/>
    <text x="560" y="33" class="ink s">I2C to the brain: SDA, SCL on pins 3 and 5 (bus 0), address 0x40</text>

    <!-- Pack -->
    <rect x="24" y="110" width="150" height="110" rx="8" class="box"/>
    <text x="99" y="138" text-anchor="middle" class="ink h">Battery pack</text>
    <text x="99" y="160" text-anchor="middle" class="ink s">3S3P, 9 vape cells</text>
    <text x="99" y="178" text-anchor="middle" class="ink s">11.1 V nominal</text>
    <text x="99" y="196" text-anchor="middle" class="ink s">12.6 V full, 780 mAh</text>

    <!-- pack to plug: 4 wires -->
    <line x1="174" y1="148" x2="190" y2="148" class="v11" stroke-width="3"/>
    <line x1="174" y1="160" x2="190" y2="160" class="bal"/>
    <line x1="174" y1="170" x2="190" y2="170" class="bal"/>
    <line x1="174" y1="182" x2="190" y2="182" class="gnd" stroke-width="3"/>
    <rect x="190" y="138" width="30" height="54" rx="3" class="plug"/>
    <text x="205" y="212" text-anchor="middle" class="ink s">4-pin</text>
    <text x="205" y="227" text-anchor="middle" class="ink s">balance plug</text>
    <line x1="220" y1="148" x2="240" y2="148" class="v11" stroke-width="3"/>
    <line x1="220" y1="160" x2="240" y2="160" class="bal"/>
    <line x1="220" y1="170" x2="240" y2="170" class="bal"/>
    <line x1="220" y1="182" x2="240" y2="182" class="gnd" stroke-width="3"/>

    <!-- BMS -->
    <rect x="240" y="110" width="170" height="110" rx="8" class="box"/>
    <text x="325" y="136" text-anchor="middle" class="ink h">Protection board</text>
    <text x="325" y="156" text-anchor="middle" class="ink s">3S BMS, 20 A</text>
    <text x="325" y="174" text-anchor="middle" class="ink s">pads 0V, 4V, 8V, 12.6V</text>
    <text x="325" y="192" text-anchor="middle" class="ink s">cuts power on a low</text>
    <text x="325" y="208" text-anchor="middle" class="ink s">cell or a short</text>

    <!-- BMS + to INA219 Vin+ -->
    <line x1="410" y1="140" x2="450" y2="140" class="v11"/>
    <text x="430" y="132" text-anchor="middle" class="ink s">+</text>
    <!-- INA219 -->
    <rect x="450" y="110" width="140" height="62" rx="8" class="box"/>
    <text x="520" y="134" text-anchor="middle" class="ink h">INA219</text>
    <text x="520" y="154" text-anchor="middle" class="ink s">monitor, in the + wire</text>
    <line x1="590" y1="140" x2="620" y2="140" class="v11"/>

    <!-- BMS − to T-plug -->
    <line x1="410" y1="200" x2="620" y2="200" class="gnd"/>
    <text x="430" y="220" text-anchor="middle" class="ink s">−</text>

    <!-- T-plug 1 -->
    <rect x="620" y="122" width="34" height="96" rx="3" class="plug"/>
    <text x="637" y="238" text-anchor="middle" class="ink s">T-plug</text>

    <!-- 11.1 V bus to regulators -->
    <path d="M654 140 H690 M690 95 V285 M690 95 H730 M690 285 H730" class="v11"/>
    <path d="M654 200 H684 a6 6 0 0 1 12 0 H706 M706 117 V307 M706 117 H730 M706 307 H730" class="gnd"/>

    <!-- 5 V regulator -->
    <rect x="730" y="72" width="150" height="62" rx="8" class="box"/>
    <text x="805" y="97" text-anchor="middle" class="ink h">AJ26 regulator</text>
    <text x="805" y="117" text-anchor="middle" class="ink s">pad set to 5 V</text>

    <!-- 7.5 V regulator -->
    <rect x="730" y="262" width="150" height="62" rx="8" class="box"/>
    <text x="805" y="287" text-anchor="middle" class="ink h">AJ26 regulator</text>
    <text x="805" y="307" text-anchor="middle" class="ink s">pad set to 7.5 V</text>

    <!-- Brain -->
    <rect x="955" y="70" width="150" height="100" rx="8" class="brain"/>
    <text x="1030" y="96" text-anchor="middle" class="ink h">Orange Pi Zero</text>
    <text x="1030" y="116" text-anchor="middle" class="ink s">the brain</text>
    <text x="1030" y="136" text-anchor="middle" class="ink s">5 V in and USB hub</text>
    <text x="1030" y="152" text-anchor="middle" class="ink s">5 V jumpered together</text>
    <line x1="880" y1="95" x2="955" y2="95" class="v5"/>
    <line x1="880" y1="117" x2="955" y2="117" class="gnd"/>

    <!-- CYD -->
    <rect x="740" y="176" width="140" height="56" rx="8" class="box"/>
    <text x="810" y="200" text-anchor="middle" class="ink h">CYD screen</text>
    <text x="810" y="219" text-anchor="middle" class="ink s">the face</text>
    <path d="M955 158 H920 V204 H880" class="data"/>
    <text x="922" y="226" class="ink s">USB-C</text>

    <!-- T-plug 2 and motor board -->
    <line x1="880" y1="285" x2="900" y2="285" class="v75"/>
    <line x1="880" y1="307" x2="900" y2="307" class="gnd"/>
    <rect x="900" y="272" width="30" height="48" rx="3" class="plug"/>
    <text x="915" y="340" text-anchor="middle" class="ink s">T-plug</text>
    <line x1="930" y1="285" x2="955" y2="285" class="v75"/>
    <line x1="930" y1="307" x2="955" y2="307" class="gnd"/>
    <rect x="955" y="262" width="150" height="66" rx="8" class="box"/>
    <text x="1030" y="287" text-anchor="middle" class="ink h">L293D board</text>
    <text x="1030" y="307" text-anchor="middle" class="ink s">+ RP2040 Zero</text>
    <text x="1030" y="322" text-anchor="middle" class="muted s">EXT VOLTAGE in</text>
    <path d="M1075 170 V262" class="data"/>
    <text x="1082" y="222" class="ink s">USB-C</text>

    <!-- Motors -->
    <line x1="1030" y1="328" x2="1030" y2="372" class="v75"/>
    <rect x="955" y="372" width="150" height="44" rx="8" class="box"/>
    <text x="1030" y="399" text-anchor="middle" class="ink h">2 gear motors</text>

    <!-- Notes -->
    <g class="ink" font-size="14">
      <text x="24" y="290" font-weight="700" font-size="15">Good to know</text>
      <text x="24" y="314">• Charging: unplug the pack at the 4-pin plug and charge it</text>
      <text x="38" y="332">off the robot with a balance charger.</text>
      <text x="24" y="356">• USB only: with the pack unplugged the brain runs from USB.</text>
      <text x="38" y="374">The wheels get no power and the INA219 reads 0 V.</text>
      <text x="24" y="398">• All grounds are joined. The motors never share the 5 V side.</text>
      <text x="24" y="422">• The CYD and the RP2040 get USB from the brain's 13-pin</text>
      <text x="38" y="440">header (pin 1 = 5 V, pin 2 = GND).</text>
      <text x="24" y="464" font-weight="700">• The pack plugs in by its 4-pin balance plug, never its Deans plug.</text>
      <text x="38" y="482" font-weight="700">Check 0 V to 0 V every time: the plug fits either way round.</text>
    </g>

    <!-- Legend -->
    <g transform="translate(24,520)" class="ink" font-size="13.5">
      <line x1="0" y1="10" x2="34" y2="10" class="v11"/><text x="42" y="15">11.1 V battery</text>
      <line x1="160" y1="10" x2="194" y2="10" class="v75"/><text x="202" y="15">7.5 V motors</text>
      <line x1="310" y1="10" x2="344" y2="10" class="v5"/><text x="352" y="15">5 V electronics</text>
      <line x1="475" y1="10" x2="509" y2="10" class="gnd"/><text x="517" y="15">ground</text>
      <line x1="590" y1="10" x2="624" y2="10" class="bal"/><text x="632" y="15">balance wires</text>
      <line x1="745" y1="10" x2="779" y2="10" class="data"/><text x="787" y="15">data (I2C, USB)</text>
      <rect x="920" y="0" width="22" height="20" rx="3" class="plug"/><text x="950" y="15">plug</text>
    </g>
  </g>
</svg>
