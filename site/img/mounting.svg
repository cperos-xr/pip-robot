<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a board mounts on Pip</title>
  <desc id="d">Exploded side view. At the bottom, the frame grid with holes. Above it, a printed stud plate: studs on its underside press into the grid, and four bolts go up through it from below, their heads trapped between the plate and the frame, so the bolts stick up like prongs. A spacer slides onto each prong to leave room for the solder joints under the board. The board sits on the spacers, and a nut on each prong holds it down.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7a8a95"/></marker>
    <pattern id="thread" width="6" height="4" patternUnits="userSpaceOnUse"><rect width="6" height="4" fill="#a7b0b8"/><path d="M0 4 L6 0" stroke="#7d8790" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#203344">Bolts become prongs, like the standoffs in a computer case</text>
  <text x="30" y="56" font-size="13" fill="#5c7280">Side view, pulled apart. Each piece slides down the dashed line onto the one below.</text>

  <!-- assembly lines -->
  <g stroke="#9fb2bd" stroke-width="1.2" stroke-dasharray="5 5">
    <path d="M220 74 V318"/><path d="M508 74 V318"/>
  </g>

  <!-- nuts -->
  <g fill="#8e989f" stroke="#59636b" stroke-width="1.5">
    <rect x="206" y="80" width="28" height="13" rx="1.5"/><rect x="494" y="80" width="28" height="13" rx="1.5"/>
  </g>
  <g stroke="#59636b" stroke-width="1"><path d="M215 80 V93 M225 80 V93 M503 80 V93 M513 80 V93"/></g>

  <!-- PCB with parts on top and solder joints underneath -->
  <rect x="330" y="104" width="82" height="16" rx="2" fill="#2a2d31"/>
  <rect x="440" y="110" width="34" height="10" rx="1" fill="#d7dde2" stroke="#9aa5ad"/>
  <g fill="#c79a2e"><rect x="262" y="106" width="3" height="14"/><rect x="272" y="106" width="3" height="14"/><rect x="282" y="106" width="3" height="14"/><rect x="292" y="106" width="3" height="14"/></g>
  <rect x="170" y="120" width="400" height="12" rx="2" fill="#2f8f4e" stroke="#1d6636" stroke-width="1.5"/>
  <g fill="#ffffff"><rect x="214" y="120" width="12" height="12"/><rect x="502" y="120" width="12" height="12"/></g>
  <g fill="#c4cad0" stroke="#8b949b" stroke-width="1">
    <path d="M258 132 q5 8 10 0 z M268 132 q5 8 10 0 z M278 132 q5 8 10 0 z M288 132 q5 8 10 0 z"/>
    <path d="M345 132 q5 8 10 0 z M362 132 q5 8 10 0 z M379 132 q5 8 10 0 z M396 132 q5 8 10 0 z M444 132 q5 8 10 0 z M460 132 q5 8 10 0 z"/>
  </g>

  <!-- spacers -->
  <g fill="#d4ad52" stroke="#9b7a2b" stroke-width="1.5">
    <rect x="209" y="160" width="22" height="46" rx="2"/><rect x="497" y="160" width="22" height="46" rx="2"/>
  </g>
  <g stroke="#ad8a37" stroke-width="1" opacity=".7"><path d="M215 160 V206 M503 160 V206"/></g>

  <!-- prongs: bolt shafts sticking up out of the plate -->
  <rect x="215" y="226" width="10" height="72" fill="url(#thread)" stroke="#6f7a83" stroke-width="1"/>
  <rect x="503" y="226" width="10" height="72" fill="url(#thread)" stroke="#6f7a83" stroke-width="1"/>

  <!-- printed stud plate, studs underneath, bolt heads in pockets on the underside -->
  <rect x="172" y="298" width="400" height="26" rx="2" fill="#2b2f33" stroke="#111" stroke-width="1.5"/>
  <g fill="#f4f6f8"><rect x="203" y="310" width="34" height="14"/><rect x="491" y="310" width="34" height="14"/></g>
  <g fill="#9aa3ab" stroke="#5f6870" stroke-width="1.5"><rect x="205" y="312" width="30" height="12" rx="2"/><rect x="493" y="312" width="30" height="12" rx="2"/></g>
  <g fill="#2b2f33" stroke="#111" stroke-width="1.5">
    <rect x="182" y="324" width="28" height="12" rx="1.5"/><rect x="278" y="324" width="28" height="12" rx="1.5"/>
    <rect x="326" y="324" width="28" height="12" rx="1.5"/><rect x="374" y="324" width="28" height="12" rx="1.5"/>
    <rect x="422" y="324" width="28" height="12" rx="1.5"/><rect x="470" y="324" width="28" height="12" rx="1.5"/>
    <rect x="534" y="324" width="28" height="12" rx="1.5"/>
  </g>

  <!-- press-down arrows -->
  <g stroke="#7a8a95" stroke-width="1.6" fill="none" marker-end="url(#ar)"><path d="M292 344 V370"/><path d="M436 344 V370"/></g>

  <!-- frame grid with holes -->
  <rect x="60" y="384" width="560" height="22" rx="3" fill="#dbe3e8" stroke="#8fa1ac" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#8fa1ac" stroke-width="1">
    <rect x="85" y="384" width="30" height="22"/><rect x="133" y="384" width="30" height="22"/><rect x="181" y="384" width="30" height="22"/>
    <rect x="229" y="384" width="30" height="22"/><rect x="277" y="384" width="30" height="22"/><rect x="325" y="384" width="30" height="22"/>
    <rect x="373" y="384" width="30" height="22"/><rect x="421" y="384" width="30" height="22"/><rect x="469" y="384" width="30" height="22"/>
    <rect x="517" y="384" width="30" height="22"/><rect x="565" y="384" width="30" height="22"/>
  </g>
  <path d="M85 406 V414 M133 406 V414" stroke="#7a8a95" stroke-width="1"/>
  <path d="M100 418 H148" stroke="#7a8a95" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="124" y="436" font-size="12" fill="#5c7280" text-anchor="middle">8 mm</text>

  <!-- labels -->
  <g stroke="#9fb2bd" stroke-width="1.2" fill="none">
    <path d="M524 86 H640"/><path d="M572 126 H640"/><path d="M520 183 H640"/><path d="M514 260 H640"/>
    <path d="M572 304 H640"/><path d="M526 318 L600 344 H640"/><path d="M562 332 L604 370 H640"/><path d="M620 395 H640"/>
  </g>
  <g font-size="14" fill="#203344">
    <text x="648" y="91"><tspan font-weight="700">Nut</tspan> holds the board down</text>
    <text x="648" y="131"><tspan font-weight="700">Your board</tspan> (PCB)</text>
    <text x="648" y="181"><tspan font-weight="700">Spacer</tspan> on each prong</text>
    <text x="648" y="198" font-size="12.5" fill="#5c7280">room for the solder joints underneath</text>
    <text x="648" y="258"><tspan font-weight="700">Bolt</tspan> pointing up: a prong</text>
    <text x="648" y="275" font-size="12.5" fill="#5c7280">four of them, one per mounting hole</text>
    <text x="648" y="309"><tspan font-weight="700">Printed stud plate</tspan></text>
    <text x="648" y="326" font-size="12.5" fill="#5c7280">made with the LEGO-ifier</text>
    <text x="648" y="349"><tspan font-weight="700">Bolt head</tspan>, trapped between</text>
    <text x="648" y="366">plate and frame</text>
    <text x="648" y="381" font-size="12.5" fill="#5c7280">(in a pocket on the plate's underside)</text>
    <text x="648" y="400"><tspan font-weight="700">Studs</tspan> press into the</text>
    <text x="648" y="417"><tspan font-weight="700">frame grid</tspan></text>
  </g>
  <text x="30" y="458" font-size="12.5" fill="#5c7280">No mounting holes, or in a hurry? Skip the bolts and hot-glue the board straight onto the plate.</text>
</svg>
